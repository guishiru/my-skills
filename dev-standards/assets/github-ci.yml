# 复制到项目的 .github/workflows/check.yml。
# 在仓库设置里把「完成检查」设为合并 PR 的必要条件（Settings → Branches → Branch protection rules）。
# 按项目实际删改语言环境和安装依赖的步骤。
name: 完成检查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来计算改动范围

      # ---- 前端（不需要可删除）----
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm
      - name: 安装前端依赖
        if: hashFiles('package.json') != ''
        run: npm ci

      # ---- Python（不需要可删除）----
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        with:
          python-version: "3.12"
      - name: 安装 Python 依赖
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          pip install pytest ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      # ---- 密钥扫描 ----
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- 完成检查 ----
      - name: 运行完成检查
        env:
          DONE_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/check_done.sh
